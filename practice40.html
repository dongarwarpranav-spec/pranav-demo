<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style> 
        .container{
            border: 2px solid rgb(21, 20, 19);
            display: grid;
            grid-template-columns: [second] 100px [first] 100px 100px;
            /* 1 fr is unit of grid */
            grid-template-rows: 100px 100px 120px 100px;
        }
        .item{
            border: 2px solid rgb(223, 6, 147);
            height: 55px;
            width: 55px;
        }
        .item6{
                grid-row: 1/2;
                
                grid-column: 1/5;
                /* this mean ki woh kitne space le raha hai jese 5 liha hai na matlab 5 block liya hai in short */
        }
        .item11{
            grid-column: 1/4;
            grid-row: 2/4;
            grid-row-start: 2;
            grid-row-end: 4;
            
        }
    </style>
</head>
<body>
    <!-- grid practice  while watching vedio  -->
     <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item item6">6</div>
        <div class="item">7</div>
        <div class="item">8</div>
        <div class="item">9</div>
        <div class="item">10</div>
        <div class="item item11">11</div>
        <div class="item">12</div>
        <div class="item">13</div>

     </div>
</body>
</html>
