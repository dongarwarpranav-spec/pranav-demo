<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Made By Me 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: black;

        }

        .card {
            background-color: beige;
            height: 68vh;
            width: 20vw;
            margin-top: 40px;
            border-radius: 20px;
            position: sticky;

        }

        .imgage img {
            border-radius: 20px;
            margin-left: 40px;
            margin-top: 5px;

        }

        .cap {
            margin-top: 10px;
        }

        .cap span {
            border: 2px solid;
            border-radius: 12px;
            padding: 5px;
            background-color: rgb(164, 251, 251);

        }

        .container p {
            color: rgb(209, 201, 201);
            font-size: 12px;

        }
        .btn button {
            border-radius: 12px;
            padding: 5px;
            background-color: aquamarine;
            margin-left: 2px;
            

        }
    </style>
</head>

<body>
    <div class="card">
        <div class="imgage">
            <img src="https://www.bing.com/th/id/OIP.7_NFNR5xl8d3fBFz3AeIPgHaHa?w=193&h=193&c=8&rs=1&qlt=90&o=6&dpr=1.3&pid=3.1&rm=2"
                alt=""><br>
            <div class="cap">
                <span>Nature</span>
                <span>Lake</span>
            </div><br>
            <div class="container">
                <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Facilis mollitia quam est enim, vero nemo
                    consequuntur illo, deleniti perspiciatis vitae quo magni obcaecati ducimus nostrum.</p>
                    <div class="btn">
                        <button>Read More</button>
                    </div>
            </div>
        </div>

    </div>
</body>

</html>
